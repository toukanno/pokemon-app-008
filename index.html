<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポケモン図鑑 ファイアレッド | PokeAPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">
        <span class="pokeball" aria-hidden="true"></span>
        ポケモンずかん
        <span class="version-tag">ファイアレッド</span>
      </h1>
      <div class="search-box">
        <input
          type="search"
          id="search-input"
          placeholder="なまえ・ばんごうで さがす"
          autocomplete="off"
        />
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status" hidden></div>
    <div id="pokemon-grid" class="grid" aria-live="polite"></div>
  </main>

  <!-- 詳細モーダル -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close aria-label="閉じる">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer class="footer">
    カントーちほう 151ひき ｜ データ提供:
    <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
